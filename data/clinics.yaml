# 晴海周辺 急病時の駆けつけ先 — 単一データソース
#
# 編集したら `python scripts/build.py` を実行する（README.md と dist/ を再生成）。
#
# hours: OpenStreetMap の opening_hours 記法の最小サブセット
#   例: "Mo-Fr 09:00-12:30,15:00-18:00; Sa 09:00-12:00; Su,PH off"
#   曜日 Mo Tu We Th Fr Sa Su / 祝日 PH / 範囲 Mo-Fr / 休診 off
#   末尾に "..." で注記を付けられる（例: Su 09:00-12:30 "連休中は休診"）
#   後のルールが前のルールを上書きする。
#   ※ 記載のない曜日は「不明」として表示する（OSM 本来の「休み」扱いではない）。
#      休みと分かっている曜日は必ず off と書くこと。
#
# holiday_note: 「連休は休診」のような落とし穴を書く専用欄。
# verified:     公式サイト等で最後に確認した日（エントリごと）。365日超で「要確認」。
# lat / lon:    空なら build 時に住所から補完して書き戻す（国土地理院の住所検索 → Nominatim）。
#               手入力も可（geo_source を書かなければ --refresh-geo でも上書きされない）。
# walk_m / walk_m_source: build が自動で書き戻す。手で書かない。
#   再計算は `python scripts/build.py --refresh-distance`（住所を直したら --refresh-geo）
#
# 個人情報（自宅住所・氏名・保険証番号など）はこのリポジトリに一切書かないこと。

