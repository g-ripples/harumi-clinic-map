# 晴海周辺 急病時の駆けつけ先 — 単一データソース
#
# 編集したら `python scripts/build.py` を実行する（README.md と dist/ を再生成）。
#
# hours: 患者が受付できる時間（＝最終受付まで）。診療終了時刻ではない。
#   公式サイトに「最終受付は終了30分前」などの規定があれば、終了時刻をその分早めて書く。
#   例: 診療 9:30-13:00・最終受付 12:30 → 09:30-12:30
#   OpenStreetMap の opening_hours 記法の最小サブセット
#   例: "Mo-Fr 09:00-12:30,15:00-18:00; Sa 09:00-12:00; Su,PH off"
#   曜日 Mo Tu We Th Fr Sa Su / 祝日 PH / 範囲 Mo-Fr / 休診 off
#   末尾に "..." で注記を付けられる（例: Su 09:00-12:30 "連休中は休診"）
#   後のルールが前のルールを上書きする。
#   ※ 記載のない曜日は「不明」として表示する（OSM 本来の「休み」扱いではない）。
#      休みと分かっている曜日は必ず off と書くこと。
#
# last_entry:   最終受付の規定（例: 診療終了の30分前）。確認して規定がなければ「公式サイトに記載なし」。
#               空欄 = まだ確認していない。
# special_days: いつもと違う日。通常の hours より優先される（今日の一覧で使う）。
#   毎年: {dates: "12/29-1/3", hours: "off"}  その年だけ: {dates: "2026-05-03~2026-05-06", hours: "off"}
#   臨時に開く日も書ける: {dates: "12/29-1/3", hours: "09:00-22:00"}。hours は必ず引用符で囲む。
#   年末年始とだけ書かれていて日付の説明がなければ 12/29〜1/3 とみなす。
# holiday_note: 「連休は休診」のような落とし穴を書く専用欄。
# verified:     公式サイト等で最後に確認した日（エントリごと）。365日超、または空欄（未確認）で「要確認」。
#               薬局の hours は処方せん受付の時間（店舗の営業時間ではない）。
# lat / lon:    空なら build 時に住所から補完して書き戻す（国土地理院の住所検索 → Nominatim）。
#               手入力も可（geo_source を書かなければ --refresh-geo でも上書きされない）。
# walk_m / walk_m_source: build が自動で書き戻す。手で書かない。
#   再計算は `python scripts/build.py --refresh-distance`（住所を直したら --refresh-geo）
#
# section:      旧 Excel の区分（小児科 / 大人用 / 外科・整形外科の救急 / 皮膚科 / 耳鼻咽喉科）＋ 薬局。
#               公式サイトの診療科ではなく「実際に使う科」で決める。同じ医院が2区分に出るなら2エントリにする。
# 個人情報（自宅住所・氏名・保険証番号など）はこのリポジトリに一切書かないこと。

